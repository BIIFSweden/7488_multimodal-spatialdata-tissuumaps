[project]
name = "spatial_mapping_of_oxylipins_in_lung_tissue"
version = "0.1.0"
authors = [
    {name = "Christophe Avenel", email = "christophe.avenel@scilifelab.se"},
]
description = "Co-registration of images from (i) mass spectrometry imaging and (ii) microscope images of the same tissue section to identify regions of interest in the microscope images to annotate the mass spectrometry image."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
dependencies = [
    "geobuf>=1.1.1",
    "geojson>=3.2.0",
    "ipykernel>=6.29.5",
    "napari-spatialdata>=0.5.5",
    "napari>=0.5.6",
    "protobuf<=3.20",
    "vext-pyqt5>=0.7.4",
    "pyqt5-tools>=5.15.9.3.3",
    "roifile>=2024.9.15",
    "spatialdata>=0.3.0",
    "spatialdata-plot>=0.2.9",
    "tissuumaps>=3.2.1.12",
    "spatialdata-io>=0.1.7",
]

[project.urls]
Repository = "https://github.com/BIIFSweden/CraigWheelock2024-1"


